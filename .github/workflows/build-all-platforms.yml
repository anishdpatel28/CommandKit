name: Build All Platforms

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for macOS
        run: npm run build:macos

      - name: Self-sign macOS app
        run: |
          APP_PATH="$(find dist/mac* -name '*.app' -maxdepth 2 | head -n 1)"
          if [ -n "$APP_PATH" ]; then
            echo "Self-signing $APP_PATH"
            codesign --deep --force --sign - "$APP_PATH"
          else
            echo "No .app found in dist/ to sign"
            exit 1
          fi

      - name: Create ZIP of macOS build
        run: |
          cd dist
          zip -r macos-build.zip .

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/macos-build.zip
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for Windows
        run: npm run build:windows

      - name: Test Windows executable exists
        run: |
          if (Test-Path "dist\win-unpacked\CommandKit.exe") {
            Write-Host "✅ Windows executable created successfully"
            Get-ChildItem "dist\win-unpacked\CommandKit.exe" | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Host "❌ Windows executable not found"
            exit 1
          }

      - name: Self-sign Windows executable (test only)
        run: |
          $exePath = "dist\win-unpacked\CommandKit.exe"
          if (Test-Path $exePath) {
            Write-Host "Self-signing Windows EXE..."
            signtool sign /a /fd SHA256 /f NUL $exePath
          }

      - name: Create ZIP of Windows build
        run: |
          cd dist
          powershell Compress-Archive -Path * -DestinationPath windows-build.zip

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/windows-build.zip
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for Linux
        run: npm run build:linux

      - name: Self-sign Linux build (GPG)
        run: |
          if compgen -G "dist/*.AppImage" > /dev/null; then
            echo "Signing AppImage..."
            for f in dist/*.AppImage; do gpg --batch --yes --passphrase "" --output "$f.sig" --detach-sig "$f"; done
          fi

      - name: Create ZIP of Linux build
        run: |
          cd dist
          zip -r linux-build.zip .

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/linux-build.zip
          retention-days: 7

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web version
        run: npm run webpack

      - name: Create ZIP of web build
        run: |
          cd build
          zip -r ../web-build.zip .

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web-build.zip
          retention-days: 7
