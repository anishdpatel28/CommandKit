name: Windows Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for Windows
        run: npm run build:windows

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/
          retention-days: 7

      - name: Test Windows executable
        run: |
          # Check if the executable was created
          if (Test-Path "dist\win-arm64-unpacked\CommandKit.exe") {
            Write-Host "✅ Windows executable created successfully"
            Get-ChildItem "dist\win-arm64-unpacked\CommandKit.exe" | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Host "❌ Windows executable not found"
            exit 1
          }

      - name: List build contents
        run: |
          Write-Host "📁 Build directory contents:"
          Get-ChildItem "dist\" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
